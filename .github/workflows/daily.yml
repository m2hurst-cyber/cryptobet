name: Macro Model Daily
on:
  schedule: [{cron: '15 21 * * 1-5'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Daily pipeline
        env: {FRED_API_KEY: '${{ secrets.FRED_API_KEY }}'}
        run: python scripts/daily_runner.py
      - name: Build methodology PDF
        run: sudo apt-get update && sudo apt-get install -y pandoc && pandoc spec/methodology.md -s --pdf-engine=weasyprint -o site/assets/methodology.pdf
      - name: Commit
        run: |
          git config user.name macro-model-bot
          git config user.email macro-model-bot@users.noreply.github.com
          git add data site
          if ! git diff --cached --quiet; then git commit -m "daily: macro model update $(date -u +%F)" && git push; fi
      - name: Optional Netlify deploy
        env:
          NETLIFY_AUTH_TOKEN: '${{ secrets.NETLIFY_AUTH_TOKEN }}'
          NETLIFY_SITE_ID: '${{ secrets.NETLIFY_SITE_ID }}'
        run: if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then npx --yes netlify-cli deploy --dir=site --prod; else echo "Hosting not configured"; fi
