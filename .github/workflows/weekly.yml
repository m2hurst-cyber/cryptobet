name: Macro Model Weekly Signal
on:
  schedule: [{cron: '0 21 * * 0'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scripts/weekly_signal.py && python scripts/compute_metrics.py && python scripts/memo_generator.py && python scripts/site_builder.py
      - run: |
          git config user.name macro-model-bot
          git config user.email macro-model-bot@users.noreply.github.com
          git add data site
          if ! git diff --cached --quiet; then git commit -m "weekly: publish sector signal $(date -u +%F)" && git push; fi
      - name: Optional Netlify deploy
        env:
          NETLIFY_AUTH_TOKEN: '${{ secrets.NETLIFY_AUTH_TOKEN }}'
          NETLIFY_SITE_ID: '${{ secrets.NETLIFY_SITE_ID }}'
        run: if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then npx --yes netlify-cli deploy --dir=site --prod; else echo "Hosting not configured"; fi
