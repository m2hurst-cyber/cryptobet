<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Macro Model v1.0 — Drill-down</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#111827;font:15px/1.5 Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:14px}.hero{background:#0f172a;color:#fff;padding:22px;border-radius:16px}.hero h1{margin:4px 0}.badge{font-size:12px;color:#667085;margin-bottom:8px}.hero .badge{color:#cbd5e1}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-top:12px}.tabs,.subtabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.tabs button,.tabs a,.subtab{padding:9px 12px;border:1px solid #d0d5dd;border-radius:999px;background:white;color:#111827;text-decoration:none;cursor:pointer}.tabs .on,.subtab.on{background:#111827;color:white}.view[hidden],.dashpanel[hidden]{display:none}.alloc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.alloc div,.metric,.tile,.seriescard{border:1px solid #e5e7eb;border-radius:10px;padding:12px;background:white;text-align:left}.alloc span,.tile span,.metric span{display:block;font-size:10px;color:#667085;text-transform:uppercase}.alloc b,.tile b,.metric b{display:block;font-size:18px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.metric,.tile,.charthead{cursor:pointer}.spin{padding:18px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px}.heat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.group{border:1px solid #e5e7eb;border-radius:12px;padding:10px}.group h3{font-size:12px;margin:0 0 6px;color:#475467}.group .tile{width:100%;border:0;border-top:1px solid #eef2f6;border-radius:0}.group .tile:first-of-type{border-top:0}.modal{margin-top:10px;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid #e5e7eb}.charthead{width:100%;border:0;background:#fff;text-align:left;padding:0}.charthead h3{margin-bottom:2px}.minicharts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.seriescard{display:block;text-decoration:none;color:#334155;min-width:0}.seriescard div{display:flex;justify-content:space-between;gap:8px}.seriescard span{font-size:11px;color:#667085}.seriescard svg{width:100%;height:95px}.seriescard strong{font-size:18px}.empty{height:95px;display:grid;place-items:center;color:#98a2b3;background:#f8fafc;border-radius:8px}.src a{margin-right:12px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}th button{border:0;background:transparent;font-weight:700;cursor:pointer}.trackcharts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.trackchart{border:1px solid #e5e7eb;border-radius:12px;padding:12px;background:#fff;cursor:pointer;text-align:left}.trackchart svg{width:100%;height:130px}@media(max-width:760px){.alloc,.metrics,.heat,.minicharts,.trackcharts{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><div class="wrap"><section class="hero"><div class="badge">Model v1.0 · forward-only live experiment</div><h1>Model drill-down</h1><p>Signal fields are append-only and immutable. Forward returns populate only after they become observable.</p></section><section class="card"><h2>Track record</h2><div class="metrics"><button class="metric" data-metric="hit"><span>Hit rate</span><b>N/A — need 8 more weeks</b></button><button class="metric" data-metric="ls"><span>Long-short</span><b>N/A — need 1 more week</b></button><button class="metric" data-metric="ic"><span>IC (12w)</span><b>N/A — need 12 more weeks</b></button><button class="metric" data-metric="turn"><span>Turnover</span><b>N/A — need 4 more weeks</b></button></div><div id="metricDetail" class="modal" hidden></div></section><section class="card"><h2>Track-record charts</h2><div class="trackcharts"><button class="trackchart" data-metric="ls"><h3>Cumulative OW − UW return</h3><div class="empty">Awaiting source history.</div><b>N/A — need 1 more week</b></button><button class="trackchart" data-metric="ic"><h3>Rolling 12-week Information Coefficient</h3><div class="empty">Awaiting source history.</div><b>N/A — need 12 more weeks</b></button></div></section><section class="card"><h2>Full historical model log</h2><div class="tablewrap"><table id="log"><thead><tr><th><button data-col="0">Date ↕</button></th><th><button data-col="1">Run UTC ↕</button></th><th><button data-col="2">Factors ↕</button></th><th><button data-col="3">Sector scores ↕</button></th><th><button data-col="4">OW ↕</button></th><th><button data-col="5">Neutral ↕</button></th><th><button data-col="6">UW ↕</button></th><th><button data-col="7">Flags ↕</button></th><th><button data-col="8">Forward returns ↕</button></th><th><button data-col="9">Public ↕</button></th></tr></thead><tbody><tr><td colspan="10">No log rows yet.</td></tr></tbody></table></div></section><section class="card src"><a href="assets/methodology.pdf">Methodology PDF</a><a href="https://github.com/m2hurst-cyber/cryptobet/blob/main/data/model_log.jsonl">Raw log on GitHub</a><a href="index.html">Dashboard</a></section></div><script>const D={"metricInfo":{"hit":"Weekly hit rate = share of eligible weeks where the equal-weight OW basket beats the equal-weight UW basket; hidden until 8 weekly observations.","ls":"Long-short cumulative return = product of one plus weekly OW-minus-UW return, less one.","ic":"Information Coefficient = Spearman rank correlation between weekly sector scores and 5-trading-day forward returns; hidden until 12 eligible weeks.","turn":"Turnover = new OW names / 3 plus new UW names / 3, averaged; hidden until 4 weekly observations."}};let sortDir={};document.querySelectorAll('#log th button').forEach(b=>b.addEventListener('click',()=>{const c=+b.dataset.col,d=sortDir[c]=-(sortDir[c]||-1),tb=document.querySelector('#log tbody'),rs=[...tb.rows];rs.sort((a,z)=>d*a.cells[c].innerText.localeCompare(z.cells[c].innerText,undefined,{numeric:true}));rs.forEach(r=>tb.appendChild(r))}));document.querySelectorAll('.metric,.trackchart').forEach(t=>t.addEventListener('click',()=>{const box=document.querySelector('#metricDetail');box.hidden=false;box.innerHTML=`<p>${D.metricInfo[t.dataset.metric]}</p><p><a href="assets/methodology.pdf#page=5">Whitepaper metrics ↗</a></p>`}));</script></body></html>
